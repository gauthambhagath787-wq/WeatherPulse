<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playwrite+NZ:wght@100..400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Yuyu&display=swap"
        rel="stylesheet">
    <link rel="icon" href="Weather Favicon.png">
</head>
<body>
    <header>
        <h1>Weather Report</h1>
    </header>
    <main>
        <div class="container">
            <form action="" class="search-form">
                <div class="search">
                    <input type="text" placeholder="Search...">
                </div>
            </form>
            <div class="info">
                <div class="flag">
                </div>
                <div class="text">
                    <div class="region-info">
                    </div>
                    <div class="region-climate">
                    </div>
                </div>
            </div>
            <p></p>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
